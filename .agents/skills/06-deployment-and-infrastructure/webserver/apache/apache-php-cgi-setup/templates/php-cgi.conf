# Managed by apache-php-cgi-setup skill. Runs .php files through php-cgi via mod_actions.
# __HANDLER_DIR__ is replaced by install-php-cgi.sh.
<IfModule mod_actions.c>
    ScriptAlias /.php-cgi-handler/ "__HANDLER_DIR__/"

    <Directory "__HANDLER_DIR__">
        Options +ExecCGI -Indexes
        AllowOverride None
        # Only reachable through Apache's internal Action redirect, never directly.
        <RequireAll>
            Require all granted
            Require env REDIRECT_STATUS
        </RequireAll>
    </Directory>

    Action application/x-httpd-php /.php-cgi-handler/php-cgi

    <FilesMatch "\.php$">
        SetHandler application/x-httpd-php
    </FilesMatch>

    # Never serve php source of backup/editor files.
    <FilesMatch "\.(php~|php\.bak|phps)$">
        Require all denied
    </FilesMatch>

    DirectoryIndex index.php index.html
</IfModule>
